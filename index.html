<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conso Claude théorique</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#c96442">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conso Claude">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --txt:#1d1d1b; --muted:#6b6a66; --accent:#c96442; --bar:#e8e4dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --card:#262522; --txt:#ecebe7; --muted:#a19f99; --accent:#e07a55; --bar:#3a3833; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border-radius:14px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; }
  h1 { font-size:1.1rem; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  .big { font-size:3.2rem; font-weight:700; letter-spacing:-.02em; color:var(--accent); line-height:1; }
  .track { position:relative; height:12px; background:var(--bar); border-radius:6px; overflow:hidden; margin:18px 0 4px; }
  .tick { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--card); opacity:.85; }
  .tick-labels { position:relative; height:2.4em; margin-bottom:14px; font-size:.72rem; color:var(--muted); }
  .tick-label { position:absolute; transform:translateX(-50%); white-space:nowrap; text-align:center; line-height:1.2; }
  .tick-label small { display:block; font-size:.62rem; opacity:.8; font-variant-numeric:tabular-nums; }
  .tick-label.past { color:var(--txt); }
  .fill { height:100%; background:var(--accent); width:0; transition:width .4s; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0; font-size:.92rem; }
  dt { color:var(--muted); }
  dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  form { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:4px; }
  select, input, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--bar); background:var(--card); color:var(--txt); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--bar); }
  dd.now { display:flex; justify-content:flex-end; align-items:center; gap:6px; }
  button.icon { background:transparent; color:var(--muted); border:none; padding:2px; line-height:0; border-radius:6px; }
  button.icon:hover { color:var(--accent); background:var(--bar); }
  .duo { display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; }
  .duo .lbl { display:block; font-size:.75rem; color:var(--muted); font-weight:500; letter-spacing:0; margin-bottom:6px; }
  .big.theo { color:var(--muted); font-size:2rem; }
  .marker { position:absolute; top:-3px; bottom:-3px; width:3px; margin-left:-1.5px; background:var(--txt); border-radius:2px; display:none; }
  .track.with-real { overflow:visible; }
  .track.with-real .fill { border-radius:6px; }
  .warn { color:var(--accent); font-size:.85rem; margin:12px 0 0; }
  .warn:empty { display:none; }
  form.cfg input { flex:1 1 100%; }
  .msg { font-size:.85rem; color:var(--muted); min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="h1">Consommation théorique Claude</h1>
    <p class="sub" id="cycle"></p>
    <div class="duo">
      <div id="real-box" hidden><span class="lbl">Réelle</span><div class="big" id="real-pct">–</div></div>
      <div><span class="lbl" id="pct-lbl" hidden>Théorique</span><div class="big" id="pct">–</div></div>
    </div>
    <div class="track" id="track"><div class="fill" id="fill"></div><div id="ticks"></div><span class="marker" id="marker" title="Théorique"></span></div>
    <div class="tick-labels" id="tick-labels"></div>
    <dl>
      <dt id="gap-dt" hidden>Écart</dt><dd id="gap" hidden></dd>
      <dt id="session-dt" hidden>Session 5 h</dt><dd id="session" hidden></dd>
      <dt>Heures écoulées</dt><dd id="elapsed"></dd>
      <dt>Prochaine remise à zéro</dt><dd id="next"></dd>
      <dt>Actualisé le</dt><dd class="now"><span id="now"></span><button type="button" id="refresh" class="icon" title="Actualiser" aria-label="Actualiser"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg></button></dd>
    </dl>
    <p class="warn" id="warn"></p>
  </div>

  <div class="card" id="start-card">
    <h1>Début de semaine</h1>
    <form id="f">
      <label>Jour
        <select id="day">
          <option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option>
          <option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option>
          <option value="0">Dimanche</option>
        </select>
      </label>
      <label>Heure <input type="time" id="time" step="60" required></label>
      <button type="submit">Enregistrer</button>
      <button type="button" class="ghost" id="reset">Défaut</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h1>Consommation réelle <span style="font-weight:400;color:var(--muted)">(facultatif)</span></h1>
    <p class="sub" style="margin-bottom:12px">Via votre webhook n8n. Le jeton reste sur cet appareil.</p>
    <form id="cfg" class="cfg">
      <label style="flex:1 1 100%">URL du webhook <input type="url" id="cfg-url" placeholder="https://…/webhook/conso-claude"></label>
      <label style="flex:1 1 100%">Jeton <input type="password" id="cfg-token" autocomplete="off" placeholder="X-Conso-Token"></label>
      <button type="submit">Enregistrer</button>
      <button type="button" class="ghost" id="cfg-clear">Effacer</button>
    </form>
    <div class="msg" id="cfg-msg"></div>
  </div>
</main>

<script>
const DEFAULT = { day: 6, hour: 14, minute: 0 };   // samedi 14h00
const COOKIE = "claudeWeekStart";
const WEEK_MS = 7 * 24 * 3600 * 1000;
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

function readSettings() {
  let raw = null;
  const m = document.cookie.match(new RegExp("(?:^|; )" + COOKIE + "=([^;]*)"));
  if (m) raw = decodeURIComponent(m[1]);
  else { try { raw = localStorage.getItem(COOKIE); } catch (e) {} }
  if (raw) {
    const [d, h, mi] = raw.split(":").map(Number);
    if ([d, h, mi].every(Number.isInteger) && d >= 0 && d <= 6 && h >= 0 && h <= 23 && mi >= 0 && mi <= 59)
      return { day: d, hour: h, minute: mi };
  }
  return { ...DEFAULT };
}

function saveSettings(s) {
  const v = `${s.day}:${s.hour}:${s.minute}`;
  document.cookie = `${COOKIE}=${encodeURIComponent(v)}; max-age=${3600*24*365*2}; path=/; SameSite=Lax`;
  try { localStorage.setItem(COOKIE, v); } catch (e) {}   // secours si cookies bloqués (ex. fichier local)
}

function clearSettings() {
  document.cookie = `${COOKIE}=; max-age=0; path=/; SameSite=Lax`;
  try { localStorage.removeItem(COOKIE); } catch (e) {}
}

// Dernier début de semaine <= maintenant (heure locale)
function lastStart(now, s) {
  const d = new Date(now);
  d.setHours(s.hour, s.minute, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - s.day + 7) % 7));
  if (d > now) d.setDate(d.getDate() - 7);
  return d;
}

const pad = n => String(n).padStart(2, "0");
const fmtDate = d => `${DAYS[d.getDay()]} ${d.getDate()}/${pad(d.getMonth()+1)} à ${d.getHours()}h${pad(d.getMinutes())}`;
const fmtNum = (n, dec) => n.toLocaleString("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec });

// ---- Consommation réelle (facultatif, via webhook n8n) ----
const REAL_CFG = "consoRealCfg", REAL_LAST = "consoRealLast";
const DEFAULT_URL = "https://n8n.ziller.fr/webhook/conso-claude";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let real = lsGet(REAL_LAST);   // dernière réponse reçue (affichée hors ligne)
let realErr = "", lastFetch = 0;

async function fetchReal(force) {
  const cfg = lsGet(REAL_CFG);
  if (!cfg || !cfg.url || !cfg.token) { real = null; realErr = ""; render(); return; }
  if (!force && Date.now() - lastFetch < 60000) return;   // pas plus d'un appel par minute
  lastFetch = Date.now();
  try {
    const r = await fetch(cfg.url, { headers: { "X-Conso-Token": cfg.token }, cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    if (typeof j.seven_day_pct !== "number" || !j.seven_day_resets_at) throw new Error("Réponse inattendue");
    real = j; realErr = ""; lsSet(REAL_LAST, j);
  } catch (e) {
    realErr = "Consommation réelle indisponible : " + (e.message || e);
  }
  render();
}

// Bornes de la semaine : calées sur Anthropic si la conso réelle est connue, sinon sur le réglage manuel
function week(now) {
  if (real && real.seven_day_resets_at) {
    const next = new Date(real.seven_day_resets_at);
    while (next <= now) next.setDate(next.getDate() + 7);   // donnée périmée (hors ligne)
    const start = new Date(next); start.setDate(start.getDate() - 7);
    return { start, next, auto: true };
  }
  const start = lastStart(now, readSettings());
  const next = new Date(start); next.setDate(next.getDate() + 7);
  return { start, next, auto: false };
}

const $ = id => document.getElementById(id);
const show = (ids, on) => ids.forEach(id => { $(id).hidden = !on; });
const fmtTime = d => `${d.getHours()}h${pad(d.getMinutes())}`;

function render() {
  const s = readSettings();
  const now = new Date();
  const { start, next, auto } = week(now);
  // Heures « d'horloge » : ignore le changement d'heure été/hiver (semaine = toujours 168 h)
  const wall = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds());
  const elapsedH = Math.max(0, (wall(now) - wall(start)) / 3600000);
  const pct = Math.min(100, elapsedH / 168 * 100);
  const hasReal = !!(real && auto);

  $("pct").textContent = fmtNum(pct, 0) + " %";
  $("pct").classList.toggle("theo", hasReal);
  show(["real-box", "pct-lbl", "gap-dt", "gap"], hasReal);
  $("h1").textContent = hasReal ? "Consommation Claude" : "Consommation théorique Claude";
  $("track").classList.toggle("with-real", hasReal);
  $("marker").style.display = hasReal ? "block" : "none";
  $("start-card").hidden = hasReal;

  if (hasReal) {
    const rp = Math.max(0, Math.min(100, real.seven_day_pct));
    $("real-pct").textContent = fmtNum(rp, 0) + " %";
    $("fill").style.width = rp + "%";
    $("marker").style.left = pct + "%";
    const g = Math.round(rp) - Math.round(pct);
    $("gap").textContent = g === 0 ? "dans le rythme" : (g < 0 ? `${-g} pt${g < -1 ? "s" : ""} de marge` : `${g} pt${g > 1 ? "s" : ""} d'avance sur le rythme`);
    document.title = `${fmtNum(rp, 0)} % / ${fmtNum(pct, 0)} % · Conso Claude`;
  } else {
    $("fill").style.width = pct + "%";
    document.title = fmtNum(pct, 0) + " % · Conso Claude";
  }

  const sess = hasReal && typeof real.five_hour_pct === "number";
  show(["session-dt", "session"], sess);
  if (sess) $("session").textContent = fmtNum(real.five_hour_pct, 0) + " %" + (real.five_hour_resets_at ? " · fin " + fmtTime(new Date(real.five_hour_resets_at)) : "");

  // Jalons : un trait à chaque minuit de la semaine, avec le jour qui commence
  const ticks = $("ticks"), labels = $("tick-labels");
  ticks.innerHTML = ""; labels.innerHTML = "";
  const m = new Date(start); m.setHours(24, 0, 0, 0);   // premier minuit après le début
  for (; m < next; m.setDate(m.getDate() + 1)) {
    const pos = (wall(m) - wall(start)) / 3600000 / 168 * 100;
    if (pos <= 0 || pos >= 100) continue;
    const t = document.createElement("span"); t.className = "tick"; t.style.left = pos + "%";
    ticks.appendChild(t);
    const l = document.createElement("span"); l.className = "tick-label"; l.style.left = pos + "%";
    l.innerHTML = `${DAYS[m.getDay()].slice(0, 3)}.<small>${fmtNum(pos, 0)} %</small>`;
    if (m <= now) l.classList.add("past");
    labels.appendChild(l);
  }
  $("elapsed").textContent = fmtNum(elapsedH, 0) + " h / 168 h";
  $("next").textContent = fmtDate(next);
  $("now").textContent = fmtDate(now);
  $("cycle").textContent = "Semaine démarrée " + fmtDate(start) + (auto ? " (date Anthropic)" : "");

  // Avertissements : erreur d'appel, données anciennes, fin de connexion n8n proche
  const warns = [];
  if (realErr) warns.push(realErr + (real ? " — dernière valeur connue affichée." : ""));
  else if (hasReal && real.fetched_at && now - new Date(real.fetched_at) > 2 * 3600000)
    warns.push("Valeur réelle relevée le " + fmtDate(new Date(real.fetched_at)) + ".");
  if (hasReal && real.connection_expires_at) {
    const days = (new Date(real.connection_expires_at) - now) / 86400000;
    if (days < 5) warns.push(days <= 0 ? "Connexion n8n ↔ Claude expirée : lancez reconnect-n8n.ps1."
      : `Connexion n8n ↔ Claude à renouveler avant le ${fmtDate(new Date(real.connection_expires_at))} (reconnect-n8n.ps1).`);
  }
  $("warn").textContent = warns.join(" ");

  $("day").value = s.day;
  $("time").value = `${pad(s.hour)}:${pad(s.minute)}`;
}

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const [h, mi] = document.getElementById("time").value.split(":").map(Number);
  saveSettings({ day: Number(document.getElementById("day").value), hour: h, minute: mi });
  document.getElementById("msg").textContent = "Réglage enregistré.";
  render();
});
document.getElementById("reset").addEventListener("click", () => {
  clearSettings();
  document.getElementById("msg").textContent = "Retour au défaut : samedi 14h00.";
  render();
});

// Configuration de la conso réelle
(function initCfg() {
  const cfg = lsGet(REAL_CFG) || {};
  $("cfg-url").value = cfg.url || DEFAULT_URL;
  $("cfg-token").value = cfg.token || "";
})();
$("cfg").addEventListener("submit", e => {
  e.preventDefault();
  const url = $("cfg-url").value.trim(), token = $("cfg-token").value.trim();
  if (!url || !token) { $("cfg-msg").textContent = "Renseignez l'URL et le jeton."; return; }
  lsSet(REAL_CFG, { url, token }); lsSet(REAL_LAST, null); real = null;
  $("cfg-msg").textContent = "Enregistré, interrogation en cours…";
  fetchReal(true).then(() => { $("cfg-msg").textContent = realErr ? realErr : "Connexion OK."; });
});
$("cfg-clear").addEventListener("click", () => {
  lsSet(REAL_CFG, null); lsSet(REAL_LAST, null); real = null; realErr = "";
  $("cfg-token").value = ""; $("cfg-msg").textContent = "Consommation réelle désactivée.";
  render();
});

render();
fetchReal(true);
// Rafraîchissement à chaque heure pile (hh:00) tant que la page reste ouverte.
// On vérifie toutes les 5 s si l'heure a changé depuis le dernier calcul
// (plus fiable qu'un minuteur unique, qui peut dériver si l'onglet est endormi).
let lastHourKey = new Date().toDateString() + new Date().getHours();
setInterval(() => {
  const k = new Date().toDateString() + new Date().getHours();
  if (k !== lastHourKey) { lastHourKey = k; render(); fetchReal(true); }
}, 5000);

$("refresh").addEventListener("click", () => { render(); fetchReal(true); });

// Retour sur l'onglet / l'appli (veille, changement d'appli) : on recalcule
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); fetchReal(false); } });

// PWA : enregistrement du service worker (installation + hors ligne)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
